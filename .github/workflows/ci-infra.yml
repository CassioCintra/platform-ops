name: CI — infra validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy env example
        run: cp .env.example .env

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Start base infra
        run: docker compose up -d postgres kafka keycloak

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 10); do
            docker compose exec -T postgres pg_isready -U order_user -d order_platform && break
            echo "Attempt $i/10 failed, retrying in 5s..."
            sleep 5
          done

      - name: Wait for Kafka
        run: |
          for i in $(seq 1 12); do
            docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh \
              --bootstrap-server localhost:9092 > /dev/null 2>&1 && break
            echo "Attempt $i/12 failed, retrying in 5s..."
            sleep 5
          done

      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 20); do
            status=$(docker inspect --format='{{.State.Health.Status}}' order-keycloak 2>/dev/null || echo "not_found")
            [ "$status" = "healthy" ] && break
            echo "Attempt $i/20: status=$status, retrying in 10s..."
            sleep 10
          done

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
