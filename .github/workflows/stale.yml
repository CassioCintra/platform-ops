name: Stale issues and PRs

on:
  schedule:
    - cron: '0 9 * * 1'  # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Run stale action
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been open for 30 days with no activity.
            It will be closed in 7 days unless there is new activity.
            If this is still relevant, please leave a comment or remove the stale label.
          close-issue-message: >
            This issue was closed automatically after 7 days of inactivity.
            Feel free to reopen it if it is still relevant.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been open for 14 days with no activity.
            It will be closed in 7 days unless there is new activity.
            If this is still in progress, please leave a comment or remove the stale label.
          close-pr-message: >
            This pull request was closed automatically after 7 days of inactivity.
            Feel free to reopen it if the work is still relevant.
          exempt-issue-labels: 'pinned,security,in-progress'
          exempt-pr-labels: 'pinned,security,in-progress'
          exempt-draft-pr: true
