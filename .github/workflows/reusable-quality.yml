name: Reusable — quality checks

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version used to build the service'
        required: false
        type: string
        default: '21'
      enable-tests:
        description: 'Whether to run unit and integration tests'
        required: false
        type: boolean
        default: true
      coverage-minimum:
        description: 'Minimum line coverage percentage required to pass (0-100)'
        required: false
        type: number
        default: 90
      enable-sonar:
        description: 'Whether to run SonarQube Cloud analysis. Set to false if SONAR_TOKEN is not configured.'
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        description: 'SonarQube Cloud token for static analysis'
        required: false

jobs:
  # ── Job 1: Dockerfile lint ───────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ── Job 2: unit and integration tests + coverage ─────────────────────────────
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    if: inputs.enable-tests
    permissions:
      contents: read         # required by actions/checkout
      checks: write          # required by mikepenz/action-junit-report
      pull-requests: write   # required by madrapps/jacoco-report (PR coverage comment)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Run tests with JaCoCo coverage
        run: ./mvnw -B verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Test report - ${{ github.repository }}

      - name: Check coverage threshold
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ github.token }}
          min-coverage-overall: ${{ inputs.coverage-minimum }}
          min-coverage-changed-files: ${{ inputs.coverage-minimum }}
          title: Code coverage report
          update-comment: true
          pass-emoji: ':white_check_mark:'
          fail-emoji: ':x:'

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ── Job 3: static analysis (SonarQube Cloud) ────────────────────────────────
  sonar:
    name: Static analysis (SonarQube Cloud)
    runs-on: ubuntu-latest
    needs: tests
    # secrets cannot be referenced in job-level if expressions.
    # Use the enable-sonar input (boolean) to control this job instead.
    if: inputs.enable-tests && inputs.enable-sonar
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Compile project
        run: ./mvnw -B compile -DskipTests

      - name: Download coverage report
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
