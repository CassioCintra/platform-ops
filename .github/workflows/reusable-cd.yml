name: Reusable — build, tag and push image

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name (e.g. order-service). Used as the image name.'
        required: true
        type: string
      java-version:
        description: 'Java version used to build the service'
        required: false
        type: string
        default: '21'
    secrets:
      GHCR_TOKEN:
        description: 'GitHub token with packages:write permission'
        required: true
    outputs:
      image-tag:
        description: 'Semver tag generated for the image (e.g. v1.2.3)'
        value: ${{ jobs.tag.outputs.new-tag }}

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  # ── Job 1: bump semver tag from conventional commits ────────────────────────
  tag:
    name: Generate semver tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version from conventional commits
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GHCR_TOKEN }}
          default_bump: patch
          tag_prefix: v
          # feat: → minor | fix: → patch | feat!: / BREAKING CHANGE → major
          release_branches: main

  # ── Job 2: build and push Docker image ──────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Build application artifact
        run: ./mvnw -B -q package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.service-name }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.new-tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
