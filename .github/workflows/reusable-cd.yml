name: Reusable — build, tag and push image

# NOTE: the commit bot (github-actions[bot]) needs push access to main.
# In GitHub: Settings -> Branches -> main -> Allow specified actors to bypass
# and add "github-actions[bot]", OR use a PAT with repo scope as GHCR_TOKEN.

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name (e.g. order-service). Used as the image name.'
        required: true
        type: string
      java-version:
        description: 'Java version used to build the service'
        required: false
        type: string
        default: '21'
    secrets:
      GHCR_TOKEN:
        description: 'GitHub token with packages:write permission'
        required: true
    outputs:
      image-tag:
        description: 'Semver tag generated for the image (e.g. v1.2.3)'
        value: ${{ jobs.tag.outputs.new-tag }}

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  # ── Job 1: bump semver tag from conventional commits ────────────────────────
  tag:
    name: Generate semver tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new-tag: ${{ steps.bump.outputs.new_tag }}
      new-version: ${{ steps.strip.outputs.version }}
      changelog: ${{ steps.bump.outputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Bump version from conventional commits
        id: bump
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GHCR_TOKEN }}
          default_bump: patch
          tag_prefix: v
          release_branches: main

      - name: Strip v prefix from tag (e.g. v1.2.3 to 1.2.3)
        id: strip
        run: echo "version=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ steps.bump.outputs.new_tag }}

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Update pom.xml version
        run: ./mvnw -B versions:set -DnewVersion=${{ steps.strip.outputs.version }} -DgenerateBackupPoms=false

      - name: Commit updated pom.xml
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(release): bump pom.xml version to ${{ steps.strip.outputs.version }} [skip ci]'
          file_pattern: '**/pom.xml'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

  # ── Job 2: build and push Docker image ──────────────────────────────────────
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Set lowercase org name
        id: org
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build application artifact
        run: ./mvnw -B -q package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.org.outputs.name }}/${{ inputs.service-name }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.new-tag }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: create GitHub Release with changelog ──────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [tag, build-and-push]
    permissions:
      contents: write

    steps:
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.tag.outputs.new-tag }}
          name: ${{ inputs.service-name }} ${{ needs.tag.outputs.new-tag }}
          body: ${{ needs.tag.outputs.changelog }}
          generate_release_notes: false


