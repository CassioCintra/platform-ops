name: Reusable - cleanup workflow runs

on:
  workflow_call:
    inputs:
      keep-runs:
        description: 'Number of most recent workflow runs to keep'
        required: false
        type: number
        default: 5
      workflow-id:
        description: 'Optional workflow file name or ID to clean only one workflow'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      keep-runs:
        description: 'Number of most recent workflow runs to keep'
        required: false
        type: number
        default: 5
      workflow-id:
        description: 'Optional workflow file name or ID to clean only one workflow'
        required: false
        type: string
        default: ''

jobs:
  cleanup:
    name: Cleanup workflow runs
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout platform-ops
        uses: actions/checkout@v6
        with:
          repository: CassioCintra/platform-ops

      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_RUNS: ${{ inputs.keep-runs }}
          WORKFLOW_ID: ${{ inputs.workflow-id }}
        run: ./scripts/cleanup/run.sh
