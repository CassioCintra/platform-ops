name: CI — infra validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy env example
        run: cp .env.example .env

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Start base infra
        run: docker compose up -d postgres kafka keycloak

      - name: Wait for PostgreSQL
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 30
          max_attempts: 5
          command: docker compose exec -T postgres pg_isready -U ${{ env.POSTGRES_USER }} -d ${{ env.POSTGRES_DB }}
        env:
          POSTGRES_USER: order_user
          POSTGRES_DB: order_platform

      - name: Wait for Kafka
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 30
          max_attempts: 8
          command: docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1

      - name: Wait for Keycloak
        uses: nick-fields/retry@v3
        with:
          timeout_seconds: 30
          max_attempts: 10
          command: docker compose exec -T keycloak curl -sf http://localhost:8080/health/ready

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
