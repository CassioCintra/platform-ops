name: Dependency update check

on:
  schedule:
    - cron: '0 8 * * 1'  # every Monday at 08:00 UTC
  workflow_dispatch:

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Renovate
        uses: renovatebot/github-action@v46
        with:
          configurationFile: .github/renovate.json
        env:
          # RENOVATE_TOKEN requires a PAT with repo scope.
          # The default GITHUB_TOKEN cannot open PRs on protected branches.
          # Create a PAT and add it as a repository secret named RENOVATE_TOKEN.
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
