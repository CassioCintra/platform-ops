name: Reusable - security checks

on:
  workflow_call:

jobs:
  secret-scan:
    name: Secret detection (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  license-scan:
    name: License compliance (Maven)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Check dependency licenses
        run: |
          ./mvnw -B license:add-third-party \
            -Dlicense.failIfWarning=false \
            -Dlicense.excludedScopes=test
