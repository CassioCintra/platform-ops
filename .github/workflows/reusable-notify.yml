name: Reusable — pipeline notification

on:
  workflow_call:
    inputs:
      service-name:
        description: 'Service name to include in the notification'
        required: true
        type: string
      image-tag:
        description: 'Image tag that was published (e.g. v1.2.3)'
        required: false
        type: string
        default: ''
      overall-status:
        description: 'Overall pipeline result: success, failure or cancelled'
        required: true
        type: string
      tests-result:
        description: 'Result of the quality/tests job'
        required: false
        type: string
        default: 'skipped'
      quality-result:
        description: 'Result of the sonar/coverage job'
        required: false
        type: string
        default: 'skipped'
      security-result:
        description: 'Result of the security job'
        required: false
        type: string
        default: 'skipped'
      migration-result:
        description: 'Result of the db-migration job'
        required: false
        type: string
        default: 'skipped'
      cd-result:
        description: 'Result of the cd job'
        required: false
        type: string
        default: 'skipped'
      notify-slack:
        description: 'Send notification to Slack'
        required: false
        type: boolean
        default: false
      notify-teams:
        description: 'Send notification to Microsoft Teams'
        required: false
        type: boolean
        default: false
      notify-discord:
        description: 'Send notification to Discord'
        required: false
        type: boolean
        default: false
    secrets:
      SLACK_WEBHOOK_URL:
        description: 'Slack incoming webhook URL. Required when notify-slack is true.'
        required: false
      TEAMS_WEBHOOK_URL:
        description: 'Microsoft Teams incoming webhook URL. Required when notify-teams is true.'
        required: false
      DISCORD_WEBHOOK_URL:
        description: 'Discord webhook URL. Required when notify-discord is true.'
        required: false

# How secrets reach this workflow
# ─────────────────────────────────────────────────────────────────────────────
# Secrets are declared in workflow_call.secrets above and must be passed by
# the caller — either explicitly or via `secrets: inherit`.
#
# Store SLACK_WEBHOOK_URL, TEAMS_WEBHOOK_URL and DISCORD_WEBHOOK_URL as
# repository secrets in platform-ops (Settings → Secrets and variables →
# Actions) and use `secrets: inherit` in the caller pipeline.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  notify:
    name: Send pipeline notification
    runs-on: ubuntu-latest
    permissions:
      contents: read   # required by actions/checkout (discord scripts)

    steps:
      - name: Checkout platform-ops (for discord scripts)
        if: inputs.notify-discord
        uses: actions/checkout@v6
        with:
          repository: CassioCintra/platform-ops
          ref: main

      - name: Make discord scripts executable
        if: inputs.notify-discord
        run: chmod +x scripts/discord/send-discord.sh scripts/discord/status-label.sh

      - name: Build Slack/Teams payload
        id: payload
        env:
          OVERALL_STATUS: ${{ inputs.overall-status }}
          SERVICE_NAME:   ${{ inputs.service-name }}
          IMAGE_TAG:      ${{ inputs.image-tag }}
        run: |
          if [ "$OVERALL_STATUS" = "success" ]; then
            echo "icon=:white_check_mark:" >> "$GITHUB_OUTPUT"
            echo "color=#2EA44F"           >> "$GITHUB_OUTPUT"
            title="Deploy succeeded - ${SERVICE_NAME} ${IMAGE_TAG}"
          else
            echo "icon=:x:"    >> "$GITHUB_OUTPUT"
            echo "color=#CF222E" >> "$GITHUB_OUTPUT"
            title="Pipeline failed - ${SERVICE_NAME}"
          fi
          # Multiline-safe output: handles special chars (quotes, newlines) in
          # service-name or image-tag without corrupting the GITHUB_OUTPUT format.
          printf 'title<<GHEOF\n%s\nGHEOF\n' "$title" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: inputs.notify-slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.payload.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.payload.outputs.icon }} *${{ steps.payload.outputs.title }}*\n*Repo:* <${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>\n*Branch:* `${{ github.ref_name }}`\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View pipeline>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Microsoft Teams
        if: inputs.notify-teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TITLE:             ${{ steps.payload.outputs.title }}
          REPO:              ${{ github.repository }}
          SERVER_URL:        ${{ github.server_url }}
          REF_NAME:          ${{ github.ref_name }}
          SHA:               ${{ github.sha }}
          RUN_ID:            ${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg title      "$TITLE" \
            --arg repo       "$REPO" \
            --arg server_url "$SERVER_URL" \
            --arg ref_name   "$REF_NAME" \
            --arg sha        "$SHA" \
            --arg run_url    "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            '{title: $title, text: ("**Repo:** [\($repo)](\($server_url)/\($repo)) | **Branch:** `\($ref_name)` | **Commit:** `\($sha)` | [View pipeline](\($run_url))")}')
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$TEAMS_WEBHOOK_URL"

      - name: Notify Discord
        if: inputs.notify-discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SERVICE_NAME:        ${{ inputs.service-name }}
          IMAGE_TAG:           ${{ inputs.image-tag }}
          OVERALL_STATUS:      ${{ inputs.overall-status }}
          TESTS_RESULT:        ${{ inputs.tests-result }}
          QUALITY_RESULT:      ${{ inputs.quality-result }}
          SECURITY_RESULT:     ${{ inputs.security-result }}
          MIGRATION_RESULT:    ${{ inputs.migration-result }}
          CD_RESULT:           ${{ inputs.cd-result }}
          REPO:                ${{ github.repository }}
          BRANCH:              ${{ github.ref_name }}
          COMMIT_SHA:          ${{ github.sha }}
          RUN_URL:             ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/discord/send-discord.sh




